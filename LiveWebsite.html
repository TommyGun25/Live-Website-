<!DOCTYPE html>
<html lang="en">
<style>
  section {
    height: 100vh;
    margin: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

  html, body {
    margin: 0;
    padding: 0;
    background: #E1D6C1;
  }
  
  #section1 { background: #E1D6C1; }
  #section2 { background: #E1D6C1; }
  #section3 {
    background: #E1D6C1;
    align-items: flex-start;   /* left-align instead of centering */
    padding-left: 10px;        /* breathing room from the edge */
    position: relative;
    overflow: hidden;          /* acts as the "camera frame" — clips content once it scales past the viewport */
  }
  .reveal-img-1,
  .reveal-img-2,
  .reveal-img-3 {
    opacity: 0;
}

  .scrollslowly {
    opacity: 0;
    transform: translateY(25px);
}

  /* ---- the "camera" wrapper: everything inside section 3 scales/rotates together ---- */
  #camera {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  /* ---- the placeholder word, sitting in the empty right-hand space ---- */
  #camera-word {
    position: absolute;
    top: 48%;
    right: -10px;         /* placeholder position — move to match the real empty space */
    width: 320px;          /* placeholder size */
    height: 80vh;
    opacity: 0;
    margin-top: -40vh;    /* vertically centers (half of height above), avoids stacking with GSAP's own rotation */
    transform: rotate(90deg);   /* starts tilted, like the mockup */
    transform-origin: center center;
    object-fit: cover;
  }

  /* ---------------- SVG Journey Line ---------------- */

#journey-svg{
    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    pointer-events:none;
    overflow:visible;

    z-index:1000;
}

#journey-path{

    fill:none;

    stroke:#1d1d1d;

    stroke-width:7;

    stroke-linecap:round;
    stroke-linejoin:round;

}

</style>
<body class="body">
  <section id="section1"> 
<img
    id="scrollslowly" class="scrollslowly" src="C:/Users/toman/animationImages/plsscrollslowly.png" style="width:250px; height:auto; margin-top: -300px; margin-left:15px; background-color:#E1D6C1;">
        <img id="anim" class="reveal-img-1" src="C:/Users/toman/animationImages/hi/hi.png" style="width: 300px; height: auto; margin-left: 15px; margin-top: 100px;">
  </section>

  <section id="section2">
    <img id="anim2" class="reveal-img-2" src="C:/Users/toman/animationImages/Welcome!/Welcome!.png" style="width: 680px; height: auto; margin-left: 150px; margin-top: -50px">
  </section>

  <section id="section3">
    <div id="camera">
      <img id="anim3" class="reveal-img-3" src="C:/Users/toman/animationImages/Intro/intro.png" style="width: 800px; height: auto; margin-top: 50px; margin-left: 10px;">
      <img id="camera-word" src="C:/Users/toman/animationImages/myExperience/myExperience.png" style="width: 300px; height:auto;">
    </div>
  </section>

  <svg id="journey-svg" viewBox="0 0 1148.37 1072.12" preserveAspectRatio="none">
    <g transform="translate(220, 625), scale(0.5)">
<defs>
    <filter id="crayon-texture">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="10"/>
    </filter>
  </defs>
    <path
        id="journey-path"
        filter="url(#crayon-texture)"
        d="M1147.79 0.000244141C1147.79 15.3119 1145.82 52.2453 1144.56 66.2411C1142.53 88.6851 1136.85 117.559 1134.59 133.02C1130.92 158.158 1129.85 189.362 1125.41 221.003C1114.27 300.351 1101.45 356.834 1098.22 366.762C1086.95 401.418 1063.7 451.335 1030.3 498.504C1021.78 510.543 1010.44 520.148 987.334 538.809C964.232 557.47 928.704 584.116 903.494 601.791C878.283 619.465 864.467 627.36 831.937 641.789C799.407 656.219 748.583 676.943 682.925 696.255C617.267 715.566 538.317 732.837 486.789 745.188C413.147 762.84 383.286 773.045 360.715 778.742C345.909 782.479 324.821 789.867 294.399 802.554C263.978 815.242 224.996 833.499 195.539 849.072C146.293 875.107 116.663 900.547 98.48 918.229C78.4548 937.703 60.7541 963.887 45.3378 984.306C30.502 1003.95 26.3627 1016.73 15.4097 1034.91C11.4099 1042.15 7.91091 1048.65 4.42691 1055.37C2.91668 1058.63 1.92979 1061.59 -0.582275 1072.12"

        

    />
</g>
</svg>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
   
  <script>
    gsap.to("#scrollslowly", {
  opacity: 1,
  y: 0,
  duration: 2,
  ease: "power2.out"
});
    
    gsap.registerPlugin(ScrollTrigger);

    const path = document.querySelector("#journey-path");

const length = path.getTotalLength();

gsap.set(path,{
    strokeDasharray:length,
    strokeDashoffset:length
});

    const frames = [
      "C:/Users/toman/animationImages/hi/hi.png",
      "C:/Users/toman/animationImages/hi/hi2.png",
      "C:/Users/toman/animationImages/hi/hi3.png",
      "C:/Users/toman/animationImages/hi/hi4.png",
      "C:/Users/toman/animationImages/hi/hi5.png",
      "C:/Users/toman/animationImages/hi/hi6.png",
      "C:/Users/toman/animationImages/hi/hi7.png",
      "C:/Users/toman/animationImages/hi/hi8.png",
      "C:/Users/toman/animationImages/hi/hi9.png",
      "C:/Users/toman/animationImages/hi/hi10.png"
    ];

    const frames2 = [
      "C:/Users/toman/animationImages/Welcome!/Welcome!.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!2.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!3.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!4.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!5.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!6.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!7.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!8.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!9.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!10.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!11.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!12.png",
        "C:/Users/toman/animationImages/Welcome!/Welcome!13.png"
    ];

    const frames3 = [
      "C:/Users/toman/animationImages/Intro/intro.png",
      "C:/Users/toman/animationImages/Intro/intro2.png",
      "C:/Users/toman/animationImages/Intro/intro3.png",
      "C:/Users/toman/animationImages/Intro/intro4.png",
      "C:/Users/toman/animationImages/Intro/intro5.png",
      "C:/Users/toman/animationImages/Intro/intro6.png",
      "C:/Users/toman/animationImages/Intro/intro7.png",
      "C:/Users/toman/animationImages/Intro/intro8.png",
      "C:/Users/toman/animationImages/Intro/intro9.png",
      "C:/Users/toman/animationImages/Intro/intro10.png",
      "C:/Users/toman/animationImages/Intro/intro11.png",
      "C:/Users/toman/animationImages/Intro/intro12.png",
      "C:/Users/toman/animationImages/Intro/intro13.png",
      "C:/Users/toman/animationImages/Intro/intro14.png",
      "C:/Users/toman/animationImages/Intro/intro15.png",
      "C:/Users/toman/animationImages/Intro/intro16.png",
      "C:/Users/toman/animationImages/Intro/intro17.png", 
      "C:/Users/toman/animationImages/Intro/intro18.png",
      "C:/Users/toman/animationImages/Intro/intro19.png" 
    ];

    const frames4 = [
      "C:/Users/toman/animationImages/myExperience/myExperience.png",
      "C:/Users/toman/animationImages/myExperience/myExperience2.png",
      "C:/Users/toman/animationImages/myExperience/myExperience3.png",
      "C:/Users/toman/animationImages/myExperience/myExperience4.png",
      "C:/Users/toman/animationImages/myExperience/myExperience5.png",
      "C:/Users/toman/animationImages/myExperience/myExperience6.png"
    ];


    let i = 0;
    let frameInterval = null;

    function startFrameAnim() {
      if (frameInterval) return;
      frameInterval = setInterval(() => {
        i = (i + Math.floor(Math.random() * 2) + 1) % frames.length;
        document.getElementById("anim").src = frames[i];
      }, 140);
    }

    let i2 = 0;
let frameInterval2 = null;
let introFinished = false;

function startFrameAnim2() {
  if (frameInterval2) return;

  frameInterval2 = setInterval(() => {

    if (!introFinished) {
      // Play intro frames 1-7 once
      document.getElementById("anim2").src = frames2[i2];

      if (i2 < 6) {
        i2++;
      } else {
        introFinished = true;
        i2 = 7; // Start idle at frame 8
      }

    } else {
      // Idle animation (frames 8-13)
      i2 = 7 + ((i2 - 7 + Math.floor(Math.random() * 2) + 1) % 6);
      document.getElementById("anim2").src = frames2[i2];
    }

  }, 125);
}

    let i3 = 0;
let frameInterval3 = null;
let introFinished3 = false;

function startFrameAnim3() {
  if (frameInterval3) return;

  frameInterval3 = setInterval(() => {

    if (!introFinished3) {
      // Play intro frames 1-7 once
      document.getElementById("anim3").src = frames3[i3];

      if (i3 < 14) {
        i3++;
      } else {
        introFinished3 = true;
        i3 = 14; // Start idle at frame 8
      }

    } else {
      // Idle animation (frames 8-13)
      i3 = 14 + ((i3 - 14 + Math.floor(Math.random() * 2) + 1) % 5);
      document.getElementById("anim3").src = frames3[i3];
    }

  }, 170);
}

    // same play-once-then-idle pattern as startFrameAnim3, resized for 10 frames
    let i4 = 0;
    let frameInterval4 = null;
    let introFinished4 = false;

    function startFrameAnim4() {
      if (frameInterval4) return;

      frameInterval4 = setInterval(() => {

        if (!introFinished4) {
          document.getElementById("camera-word").src = frames4[i4];

          if (i4 < 1) {
            i4++;
          } else {
            introFinished4 = true;
            i4 = 2; // idle starts here — adjust split point once you know the real frame count
          }

        } else {
          i4 = 2 + ((i4 - 2 + Math.floor(Math.random() * 2) + 1) % 4);
          document.getElementById("camera-word").src = frames4[i4];
        }

      }, 200);
    }
    

    // ---- Section 1: fade in, hold, fade back out ----
    let tl1 = gsap.timeline({
      scrollTrigger: {
        trigger: "#section1",
        start: "top top",
        end: "+=1000",
        pin: true,
        scrub: 1,
        onEnter: startFrameAnim,
        onEnterBack: startFrameAnim
      }
    });

    tl1.to(".reveal-img-1", { opacity: 1, y: -20, duration: 2.5})
       .to({}, { duration: 2.5 })
       .to(".reveal-img-1", { opacity: 0, y: -40, duration: 2.5});

      // ---- Section 2: fade in, hold, fade back out ----
    let tl2 = gsap.timeline({
      scrollTrigger: {
      trigger: "#section2",
      start: "top top",
      end: "+=1000",
      pin: true,
      scrub: 1,
      onEnter: startFrameAnim2,
      onEnterBack: startFrameAnim2
  }
});

tl2.to(".reveal-img-2", { opacity: 1, y: -20, duration: 2.5 })
   .to({}, { duration: 2.5 })
   .to(".reveal-img-2", { opacity: 0, y: -40, duration: 2.5 });

    // ---- Section 3: fade in, hold, then the camera zooms into the placeholder word ----
    let tl3 = gsap.timeline({
      scrollTrigger: {
        trigger: "#section3",
        start: "top top",
        end: "+=1700",   // extended: original 700 (fade in + hold) + 1000 for the camera zoom phase
        pin: true,
        scrub: 1,
        onEnter: startFrameAnim3,
        onEnterBack: startFrameAnim3
      }
    });

    tl3
    .to(".reveal-img-3", { opacity: 1, y: -20, duration: 4 })
       .to({}, { duration: 2.5 })
       .to("#camera-word", { opacity: 1, duration: 1 })
       // camera zooms in around the word's position — anim3 naturally scrolls out of frame since it's far from the origin
       .to("#camera", {
         scale: 2.7,                    // placeholder zoom factor — recalculate once camera-word's real size is set
         transformOrigin: "100% 5%",  // roughly where camera-word sits — move this to match its real position
         duration: 5,
         onStart: startFrameAnim4     // frame cycling begins the moment the zoom starts
       })
       .to("#camera-word", {
         rotation: 0,
         duration: 5
       }, "<")
       .to("#journey-path",{

    strokeDashoffset:0,

    duration:4,

    ease:"none"

});   // "<" = starts at the same time as the scale tween, so both move at the same rate
  </script>
</body>
</html>
